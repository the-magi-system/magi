  quote: For 2025, the Committee determined to grant our named executive officers’ long-term equity incentives entirely in the form of performance-based RSUs (“PSUs”) to further align their interests with those of our stockholders. The 2025 PSUs are tied to the Company’s compound revenue growth and relative TSR over a three-year performance period from January 1, 2025 through December 31, 2027.
  figures: []
  correct: null
  note: The proxy says the 2025 long-term incentives were granted entirely as PSUs, tied to compound revenue growth and relative TSR over January 1, 2025 through December 31, 2027.
- index: 3
  verdict: supported
  timing: standing
  quote: 'Achievement of these two independent, equally weighted performance metrics is measured over three discrete 12-, 24-, and 36-month periods. One-third of the target PSUs may be earned with respect to each performance period. The performance target for each metric, set forth below, is the same across all three measurement periods and will remain fixed for the entire performance period. If the performance target for a metric is not achieved for either the 12- or 24-month measurement period but is achieved for the 36-month measurement period, then 100% of the target PSUs associated with that metric will be earned for the entire performance period. Earned PSUs are capped at 100% of target.

    •

    Compound revenue growth of at least 30% (weighted 50%). Compound revenue growth refers to the compound growth rate of our revenue during each measurement period.

    •

    TSR of at least 300 basis points higher than the return of the Nasdaq Composite Index (weighted 50%).'
