    source: 50%
    unit: null
    claim_value: 50
    source_value: 50
  correct: null
  note: The Q&A section says Tempus may elect to pay cash for up to 50% of the shares, and lists the factors it will weigh in deciding whether to do so, which shows no decision has been made yet. It also gives the same three funding sources as the claim.
