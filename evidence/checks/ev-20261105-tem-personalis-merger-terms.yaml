  quote: 'Personalis, a Tempus Cash Election to pay cash for up to 50% of the aggregate number of outstanding shares of Personalis Common Stock (subject to automatic reduction to preserve the intended tax treatment of the Mergers). If Tempus makes a Tempus

    Cash Election, each Personalis Stockholder will receive (a) the Cash Consideration being $16.25 per share in cash, without interest (which may include a fraction of a share and, in that context, will be rounded to the nearest four decimal

    places), for such holder’s pro rata portion of shares of Personalis Common Stock subject to the Tempus Cash Election, and (b) the Stock Consideration for the holder’s remaining shares. Accordingly, Personalis Stockholders will not

    know the mix of cash and stock (or if they will receive any Cash Consideration) at the time of the Personalis Special Meeting unless Tempus makes a Tempus Cash Election prior to such time.

    In determining whether to exercise the Tempus Cash Election prior to Closing, Tempus will consider, among other factors, the Tempus Stock

    Price, cash liquidity and available financing and potential effects on the Intended Tax Treatment. Tempus expects to fund the Tempus Cash Election, if any, through cash on hand, borrowing under existing or newly arranged credit facilities and/or

    offerings of equity or equity-linked securities.'
  figures:
