claims:
- text: CCC Intelligent Solutions Holdings Inc. entered into an Agreement and Plan of Merger dated as of 14 October 2026 with Mozart Parent, LLC and Mozart Merger Sub (DE), Inc., under which the merger subsidiary merges into CCC and CCC survives as a wholly owned subsidiary of the parent.
- text: Each share of CCC common stock receives $7.75 in cash at closing.
  value: 7.75
  unit: USD per share
- text: The consideration represents a premium of about 44% to the unaffected closing price on 9 July 2026, the last trading day before media speculation about a potential sale of CCC.
  value: 44
  unit: '% premium to unaffected close'
- text: The consideration represents a premium of about 59% to the 30-day average price as of 9 July 2026.
  value: 59
  unit: '% premium to 30-day average'
- text: The acquirer group is led by GTCR and includes Elliott Investment Management.
