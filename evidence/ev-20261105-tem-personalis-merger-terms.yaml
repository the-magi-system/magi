claims:
- text: Each Personalis share is to be exchanged for Tempus Class A stock. The exchange ratio is $16.25 divided by the Tempus stock price, and is fixed at 0.3356 when the Tempus stock price is $48.42 or less.
  value: 16.25
  unit: USD per Personalis share
- text: Tempus may elect to pay cash for up to 50% of the outstanding Personalis shares. It had not yet determined whether to do so, and would fund any cash payment through cash on hand, borrowing under existing or newly arranged credit facilities, and/or offerings of equity or equity-linked securities.
  value: 50
  unit: '% (maximum cash portion)'
- text: Personalis may terminate the merger agreement if the Tempus stock price determined at closing is below $46.00.
  value: 46.0
  unit: USD per Tempus share
- text: Either company may terminate the merger agreement if the mergers have not closed by the outside date of 20 April 2027, which is extended automatically to 20 October 2027 and then to 20 April 2028 if all conditions other than the regulatory conditions have been satisfied or waived.
- text: The Tempus projections for Personalis show revenue of $115 million in 2027.
  value: 115
  unit: USD million
- text: The Tempus projections for Personalis show adjusted EBITDA of minus $86 million in 2027, reaching zero in 2030, and unlevered free cash flow of minus $113 million in 2027.
  value: -86
  unit: USD million
