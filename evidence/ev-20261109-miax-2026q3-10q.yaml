- text: Cost of revenues in the third quarter of 2026 included liquidity payments of $206.3 million, brokerage, clearing and exchange fees of $14.2 million, Section 31 fees of $23.0 million and other cost of revenues of $1.6 million; a year earlier liquidity payments were $217.3 million, brokerage, clearing and exchange fees $11.6 million and Section 31 fees nil.
  value: 206.3
  unit: USD million
