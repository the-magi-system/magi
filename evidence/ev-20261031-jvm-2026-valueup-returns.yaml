claims:
- text: 公司公开计划：2025–2030每年最低总股东返还率20%以上（合并口径），引入最低股息制度及员工RSU。返还率不是股票股息率，也不构成返还大部分账上现金的承诺。
- text: 公告列示FY2025普通股DPS650韩元、总股息7,486,679,200韩元、净利润派息比26.4%。
- text: 管理层2030收入目标为500十亿韩元（国内160、海外340），营业利润率目标20%以上，增长方向包括Pouch、Vial、Blister、海外生产、机器人与医疗、战略合作和M&A。它们是计划而非已实现结果。
body_md: 本证据区分已发生的FY2025股息与未来管理层目标。20%总返还率和2030收入目标不用于证明未来股东IRR或新增资本ROIC。
