claims:
- text: Eric Lefkofsky said that, after the FDA approved the tumour-only version of the solid tumour assay, all of Tempus's solid tumour assays would run at ADLT pricing of $4,500 from the coming 1 January, that is, 2027.
  value: 4500
  unit: USD per test
- text: He estimated that ADLT pricing for tumour-only tests adds about $80 million to $100 million of revenue and margin benefit.
  value: 90
  unit: USD million (midpoint of stated range)
- text: He said Tempus expects approval and pricing of its liquid biopsy test in the second half of 2027, which would raise its price to the mid-to-high $7,000 range and add about $250 million to $300 million.
  value: 275
  unit: USD million (midpoint of stated range)
- text: He said the data licensing business had about three consecutive quarters of more than $100 million of new total contract value, and about $200 million in the latest quarter.
- text: He said Tempus had won a request for proposals from Merck and Moderna to be the national sequencing partner for the rollout of their V940 melanoma vaccine.
