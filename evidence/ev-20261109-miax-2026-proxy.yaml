claims:
- text: On 16 June 2025 the Compensation Committee approved long-term equity awards under the 2022 Equity Incentive Plan for the named executive officers for fiscal year 2025, consisting of stock options and, for Mr. Gallagher and Ms. Comly, shares of restricted stock.
- text: The stock options vest one third on each of the first three anniversaries of the grant date, subject to the officer's continuous service and to full acceleration upon a change in control.
- text: The restricted stock vests on the earlier of the one-year anniversary of the closing of the initial public offering and a change in control, subject to continuous service.
- text: The named executive officers are eligible for discretionary annual cash bonuses; Messrs. Emmons, Schafer and Brown and Ms. Comly are eligible for guaranteed minimum annual bonuses of $200,000, $1,000,000, $250,000 and $400,000 respectively.
- text: The Compensation Committee determined Mr. Gallagher's discretionary bonus for fiscal year 2025 based on the company's overall performance, including financial performance, exchange volumes and market share, the initial and secondary public offerings and the performance of the company's stock price.
