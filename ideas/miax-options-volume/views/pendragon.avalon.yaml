methodology_fit:
- criterion: c0-trading
  assessment: met
  note: Listed on the New York Stock Exchange since August 2025 and trading normally; no offer, scheme or take-private has been announced.
- criterion: c1-engine
  assessment: partial
  note: 'The business model still passes on cost: third-quarter adjusted operating expenses fell 2% while net revenue rose 20%. Pricing power looks weaker than in v1: revenue per options contract fell 4.9% year over year to $0.098 while market share rose, so part of the share was bought with price. The other three tests still fall short. US options trade on many exchanges owned by several groups, so the engine is not unique and its share moves from month to month (18.4% in August, 16.7% in September and 16.9% in October 2026); its results show no gains from AI or other new technology beyond its own trading platform; and parallel competitors cap how far it can re-rate.'
- criterion: c2-unpriced
  assessment: unmet
  note: 'Two of the three reasons we gave in v1 for a rational discount weakened in the third quarter: net transaction revenue fell to about 56% of net revenue from about 62% (the arithmetic is in the process notes), and the diluted share count stopped rising. The third still holds: earnings follow options volume and the fee per contract, which fell 4.9% year over year, and October volume was 13.5% below a year earlier. Our expected price is above today''s because we expect 2027 EBITDA to grow on the 2026 base. That remains a forecast difference, not a framing error that the market will correct once it is cleared up, so c2 stays unmet.'
- criterion: c3-helmsman
  assessment: met
  note: Thomas Gallagher, chairman since 2008 and chief executive since 2012, still runs the company he built; Lance Emmons, chief financial officer since 2020, signed the third-quarter 10-Q with him.
- criterion: c4-incentives
  assessment: unmet
  note: The 2026 proxy statement, now recorded as evidence, shows that the fiscal 2025 equity awards to the named executive officers were stock options vesting a third a year over three years and restricted stock vesting a year after the listing, both conditional on continued service, with no share-price hurdle. Annual cash bonuses are discretionary, and four of the officers have guaranteed minimum bonuses. In October and early November 2026 two executive vice presidents again exercised options at $12 and sold the shares, and no officer bought. The only open-market purchases in the past year remain the three by accounts managed by Horizon Kinetics, 16,839 shares between December 2025 and March 2026, now also recorded as evidence; director Murray Stahl states that he does not exercise investment discretion over those accounts.
- criterion: c5-catalyst
  assessment: partial
  note: 'Correction to v1: the third-quarter results came on 29 October 2026, not in early November. The next dated readings are the monthly trading reports, published in the first week of each month, and the fourth-quarter 2026 results, expected in February 2027 (the full-year 2025 results came on 25 February 2026). They are dated, but none of them by itself points the price up.'
- criterion: c6-floor
  assessment: met
  note: Net cash of about $697 million is about $6.29 a diluted share, roughly 18% of the price in early November 2026, and debt is $1.5 million. In our conservative case, in which volatility falls back and options market share drops to about 15%, the cash-generating core still supports a value well above zero, below today's price, without any need for financing.
