methodology: excalibur
methodology_fit:
- criterion: c0-trading
  assessment: met
  note: Listed on the New York Stock Exchange since August 2025 and trading normally; no offer, scheme or take-private has been announced.
- criterion: c1-engine
  assessment: partial
  note: 'Of the four tests, the business model passes: costs are largely fixed, the second-quarter adjusted EBITDA margin was 54% and net capture per options contract rose to $0.124 from $0.117. The other three fall short. US options trade on many exchanges owned by several groups, so the engine is not unique and its market share moves from quarter to quarter; its results show no gains from AI or other new technology beyond its own trading platform; and parallel competitors cap how far it can re-rate.'
- criterion: c2-unpriced
  assessment: unmet
  note: The shares trade well below larger exchange groups on enterprise value to adjusted EBITDA, but most of that discount looks rational rather than a framing error. Transaction revenue is about 62% of net revenue, so earnings follow trading volume more closely than at peers with larger data, clearing and listing businesses; options market share edged down; and the diluted share count grew 41% in a year. Our expected price is above today's because we expect 2027 EBITDA to grow on the 2026 base and share issuance to stop. That is a forecast difference, not a mispricing that the market will correct once a framing is cleared up.
- criterion: c3-helmsman
  assessment: met
  note: Thomas Gallagher, chairman since 2008 and chief executive since 2012, still runs the company he built; Lance Emmons has been chief financial officer since 2020.
- criterion: c4-incentives
  assessment: unmet
  note: Equity awards are time-vesting stock options and restricted stock with no share-price hurdle. Over the past year the officers have sold and not bought; part of the selling came from exercising options that expired in August 2026, so it is not all discretionary. The only open-market purchases were three small ones, about 16,800 shares between December 2025 and March 2026, by accounts managed by Horizon Kinetics, whose chief executive Murray Stahl is a director; his Form 4 filings state that he does not exercise investment discretion over those accounts.
- criterion: c5-catalyst
  assessment: partial
  note: The next dated reading is the third-quarter 2026 results in early November, the first after the volatility peak. It is dated, but it does not by itself point the price up. The end of share issuance would support the price, but it has no date.
- criterion: c6-floor
  assessment: met
  note: Net cash of about $659 million is about $5.95 a diluted share, roughly 17% of the price, and debt is $1.5 million. In our conservative case, in which volatility falls back and options market share drops to about 15%, the cash-generating core still supports a value well above zero, below today's price, without any need for financing.
rationale: 'Initial view: standing aside. Our distribution for the price at the end of 2027 is centred above today''s price, because exchange costs are largely fixed, access and market data fees keep growing apart from trading volume, and we expect share issuance to stop so that profit growth reaches earnings per share. Excalibur, however, keeps a company only when its discount is a framing error that can be corrected, and here most of the discount looks like a rational price for an engine that depends on options volume, competes with parallel exchanges and has been issuing shares quickly (c2 unmet). The engine also fails the uniqueness test, and management incentives are not tied to the share price. We therefore record our price forecast without taking a position. We will reassess after the third-quarter 2026 results in early November. If transaction revenue keeps growing year over year after the volatility peak, options market share stays above 16% and the diluted share count stops rising,
  the case would rest on more than our forecast. If transaction revenue falls year over year or market share drops below 15.5%, our conservative case becomes more likely and the distribution will move down.'
process_md: '## Sources


  The company''s second-quarter 2026 results release (Form 8-K, Exhibit 99.1) and its quarterly report for the period ended 30 June 2026 (Form 10-Q), recorded as evidence in this idea, together with its earlier 2026 quarterly report, its 2025 annual report and its 2026 proxy statement.


  ## Model


  A model driven by quarterly figures. Net revenue, meaning revenue less liquidity rebates and other cost of revenues, is built in four lines: transaction and clearing fees net of rebates, access and port fees, market data fees, and other revenue. Adjusted EBITDA comes from net revenue and the company''s expense guidance. We value the company at 31 December 2027 on enterprise value to its 2027 adjusted EBITDA, add the latest net cash, and divide by the diluted share count plus the shares we expect it to issue to employees by then.


  We use three named scenarios:


  - **Volume falls back.** Market volatility normalises and options market share drops to about 15%; transaction revenue declines, access and data fees grow slowly, and the market keeps discounting a business that rests on one options engine.

  - **Base.** Options volume and fees grow modestly, market share holds above 16%, and access and data fees keep growing at double-digit rates; share issuance ends and part of the valuation gap to peers closes.

  - **Volume and price rise together.** Retail and short-dated options keep growing, market share returns above 17.5%, net capture per contract rises, and as recurring fees take a larger share of revenue the valuation moves towards peers.


  ## From our values to a market price on the target date


  The target date, the publication date plus 14 months, falls within a few days of 31 December 2027, the date at which we value each scenario. We assume that by then the market price has converged to the value of whichever scenario has happened. The values are not discounted, because they are already at the target date; for reference, our model discounts them to today at a cost of equity of 11.25%, a risk-free rate of 4.75% plus a beta of 1.3 times an equity risk premium of 5%. Cash the company generates before the end of 2027 is not added, which makes the distribution conservative. To allow for uncertainty about the valuation multiple and about timing, we spread each scenario as a lognormal distribution with a volatility of 20% around its value, mix the three by our probabilities, and report the mixture''s quantile at the middle of each probability band as one price point. The bands are 10%, 10%, 20%, 20%, 20%, 10% and 10% wide.


  ## What would change the view


  - Third-quarter and fourth-quarter 2026 transaction revenue falling year over year, or options market share below 15.5%: the conservative case becomes more likely.

  - Access and market data fees growing at single-digit rates: the effect of the 2026 fee increases has passed, and the base case is too high.

  - The diluted share count rising by more than about 1% a quarter: dilution continues beyond share-based pay.

  - Net cash used for buybacks or acquisitions that add value per share: positive; an expensive acquisition: negative.'
