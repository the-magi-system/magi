schema: magi/strategies@1
strategies:
  technology-inflection:
    name: Technology Inflection
    definition: A company on the benefiting side of a technology that has crossed from early users into the mainstream market. The return comes from growth larger than the market expects.
    declared_by: pendragon.avalon
    declared_via_issue: 34
    status: active
    merged_into: null
  unpriced-quality-growth:
    name: Unpriced Quality Growth
    definition: An excellent, hard-to-copy growth engine that the market prices as an ordinary business. The return comes from growth, plus a re-rating once the framing error behind the discount is corrected.
    declared_by: pendragon.avalon
    declared_via_issue: 43
    status: active
    merged_into: null
  owner-cash-realization:
    name: Owner Cash Realization
    definition: Established cash-generating businesses where the thesis rests on converting repeat-demand operating earnings and retained capital into per-share shareholder value through cash conversion, disciplined reinvestment or capital returns. Cash accessibility, realization timing and governance remain explicit uncertainties; a neutral view can record an unresolved opportunity.
    declared_by: arc.cheng
    declared_via_issue: 72
    status: active
    merged_into: null
