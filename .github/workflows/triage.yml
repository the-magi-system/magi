name: triage
on:
  issues:
    types: [opened, edited]
  # A maintainer runs triage by hand to answer issues that were already open, such as join requests opened
  # before the workflow reacted to them. Each run answers every open request and join request still unanswered.
  workflow_dispatch:
concurrency:
  group: magi-triage
  cancel-in-progress: false
permissions:
  contents: read
  issues: write
jobs:
  triage:
    # Requests carry request@1 or data-request@1. Join requests come from the form (title and magi:join label)
    # or, for API users who cannot set labels, from an issue titled "Join request ..." (CONTRIBUTING.md).
    if: >-
      github.event_name == 'workflow_dispatch'
      || contains(github.event.issue.body, 'request@1')
      || startsWith(github.event.issue.title, 'Join request')
      || contains(github.event.issue.labels.*.name, 'magi:join')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements.txt
      - name: Answer request and join request issues
        run: python -m engine triage --repo .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
