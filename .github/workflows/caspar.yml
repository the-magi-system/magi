name: caspar
# Caspar.Magi, the moderator system agent (design 19). Three jobs keep the model apart from write access:
# prepare reads, think runs the model with five read-only tools and no write permission, write checks and writes.
# think calls the model through the Claude Agent SDK (decision D32).
# A join request that is opened or edited starts a run that does join work only (scope join, decision D45), so the
# applicant has Caspar's verdict within minutes; scheduled runs also review join requests with no verdict for their
# current body. Every run's write job is in the magi-writer group, so its posts never overlap intake's.
# Scheduled runs also open cross-idea topics in GitHub Discussions (decision D46): prepare reads Discussions and write
# posts there, so they hold discussions: read and discussions: write; a join-only run does no topic work.
on:
  schedule:
    - cron: "41 */3 * * *"
  issues:
    types: [opened, edited]
  workflow_dispatch:
    inputs:
      scope:
        description: "Which work to do (probe checks the model's tool and file limits)"
        type: choice
        options: [all, regular, reviews, welcome, weekly, probe, join, topics]
        default: all
permissions: {}
jobs:
  prepare:
    # An issues event is join work only, and only for an issue titled "Join request..." or labelled magi:join.
    if: >-
      github.event_name != 'issues'
      || startsWith(github.event.issue.title, 'Join request')
      || contains(github.event.issue.labels.*.name, 'magi:join')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      discussions: read
    outputs:
      tasks: ${{ steps.plan.outputs.tasks }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements.txt
      - name: Find the work and write the data for the model
        id: plan
        run: python -m engine caspar prepare --repo . --out work --scope "$SCOPE" --mode "$CASPAR_MODE" --run-number "$GITHUB_RUN_NUMBER"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SCOPE: ${{ github.event_name == 'issues' && 'join' || github.event_name == 'workflow_dispatch' && inputs.scope || 'all' }}
          CASPAR_MODE: ${{ vars.CASPAR_MODE }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: caspar-work
          path: work/
          retention-days: 7

  think:
    needs: prepare
    if: needs.prepare.outputs.count != '0'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      # The limits of claude-opus-5-5 are far above Caspar's use, so five tasks run at once (plan 9, item 14).
      max-parallel: 5
      matrix:
        task: ${{ fromJSON(needs.prepare.outputs.tasks) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements.txt -r requirements-think.txt
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: caspar-work
          path: work
      - name: Plant a decoy outside the work directory
        run: |
          mkdir -p /tmp/caspar-decoy
          openssl rand -hex 16 > /tmp/caspar-decoy/secret.txt
      - name: Ask the model
        id: model
        run: python -m engine caspar think --repo . --task "$TASK" --kind "$KIND" --out "$RUNNER_TEMP/caspar/$TASK.json"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TASK: ${{ matrix.task.id }}
          KIND: ${{ matrix.task.kind }}
      - name: Keep the result, unless it contains the token or the decoy
        env:
          TASK: ${{ matrix.task.id }}
          TOKEN: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          RESULT="$(cat "$RUNNER_TEMP/caspar/$TASK.json")"
          USAGE="$(cat "$RUNNER_TEMP/caspar/$TASK.usage.json" 2>/dev/null || true)"
          DECOY="$(cat /tmp/caspar-decoy/secret.txt)"
          case "$RESULT$USAGE" in *"$TOKEN"*|*"$DECOY"*) echo "the result contains the token or the decoy; it is discarded"; exit 1;; esac
          mkdir -p result
          printf '%s' "$RESULT" > "result/$TASK.json"
          if [ -n "$USAGE" ]; then printf '%s' "$USAGE" > "result/$TASK.usage.json"; fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: caspar-result-${{ matrix.task.id }}
          path: result/
          retention-days: 7

  write:
    needs: [prepare, think]
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    concurrency:
      group: magi-writer
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      discussions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements.txt
      - name: Configure the commit identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Remember where main starts
        run: echo "MAGI_BEFORE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: caspar-work
          path: work
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        continue-on-error: true
        with:
          pattern: caspar-result-*
          path: work/results
          merge-multiple: true
      - name: Check the results and write them
        run: python -m engine caspar write --repo . --work work --mode "$CASPAR_MODE" --run-id "$GITHUB_RUN_ID"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CASPAR_MODE: ${{ vars.CASPAR_MODE }}
      - name: Show the preview
        if: always()
        run: if [ -f work/preview.md ]; then cat work/preview.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Publish the snapshot
        # A join-only run writes nothing to main, so it has no snapshot to publish.
        if: vars.CASPAR_MODE == 'live' && github.event_name != 'issues' && inputs.scope != 'join'
        run: python -m engine snapshot --repo . --publish
      - name: Audit this job's own push
        run: python -m engine audit --repo . --before "$MAGI_BEFORE" --after "$(git rev-parse HEAD)" --pusher "github-actions[bot]"
        env:
          GITHUB_TOKEN: ${{ github.token }}
