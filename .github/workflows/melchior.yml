name: melchior
# Melchior.Magi, the recorder system agent (design 22). Three jobs keep the model apart from write access:
# prepare reads and fetches the evidence sources, think runs the model with no repository token and no write
# permission, write checks the results and writes. Two switches: MELCHIOR_MODE controls the program part (fills,
# settlements, series), as before; MELCHIOR_MODEL_MODE controls the model part, off when it is not set, never higher
# than MELCHIOR_MODE, and in preview only in runs started by hand (plan 9, items 1 and 2). With the model part off,
# prepare schedules no model task, think does not run and no job reads the API key.
on:
  schedule:
    - cron: "47 23 * * *"
  workflow_dispatch:
    inputs:
      scope:
        description: "Which work to do (every scope does the program part; probe checks the model's tool limits)"
        type: choice
        options: [all, program, evidence, referrals, rulings, probe]
        default: all
permissions: {}
jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    outputs:
      tasks: ${{ steps.fetch.outputs.tasks }}
      count: ${{ steps.fetch.outputs.count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements.txt
      - name: Find the work
        run: python -m engine melchior prepare --repo . --out work --scope "$SCOPE" --mode "$MELCHIOR_MODE" --model-mode "$MELCHIOR_MODEL_MODE" --event "$GITHUB_EVENT_NAME" --run-number "$GITHUB_RUN_NUMBER"
        env:
          SCOPE: ${{ github.event_name == 'workflow_dispatch' && inputs.scope || 'all' }}
          MELCHIOR_MODE: ${{ vars.MELCHIOR_MODE }}
          MELCHIOR_MODEL_MODE: ${{ vars.MELCHIOR_MODEL_MODE }}
          MELCHIOR_MONTHLY_USD: ${{ vars.MELCHIOR_MONTHLY_USD }}
          GITHUB_TOKEN: ${{ github.token }}
      - name: Fetch the sources
        # The only step with the project's contact for sec.gov, a secret so that the public log masks it (plan 9,
        # item 24). It is sent to sec.gov hosts only; without it no request goes there.
        id: fetch
        run: python -m engine melchior fetch --repo . --work work
        env:
          MAGI_HTTP_CONTACT: ${{ secrets.MAGI_HTTP_CONTACT }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: melchior-work
          path: work/
          retention-days: 7

  think:
    needs: prepare
    if: needs.prepare.outputs.count != '0'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      # The limits of claude-opus-5-5 are far above this use, so five tasks run at once (plan 9, item 14).
      max-parallel: 5
      matrix:
        task: ${{ fromJSON(needs.prepare.outputs.tasks) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements.txt -r requirements-think.txt
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: melchior-work
          path: work
      - name: Plant a decoy outside the work directory
        run: |
          mkdir -p /tmp/melchior-decoy
          openssl rand -hex 16 > /tmp/melchior-decoy/secret.txt
      - name: Ask the model
        id: model
        run: python -m engine melchior think --repo . --task "$TASK" --kind "$KIND" --out "$RUNNER_TEMP/melchior/$TASK.json"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TASK: ${{ matrix.task.id }}
          KIND: ${{ matrix.task.kind }}
      - name: Keep the result, unless it contains the key or the decoy
        # Runs after a failed call too, so that the spending it reported is kept for usage/.
        if: ${{ !cancelled() }}
        env:
          TASK: ${{ matrix.task.id }}
          TOKEN: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          RESULT="$(cat "$RUNNER_TEMP/melchior/$TASK.json" 2>/dev/null || true)"
          USAGE="$(cat "$RUNNER_TEMP/melchior/$TASK.usage.json" 2>/dev/null || true)"
          DECOY="$(cat /tmp/melchior-decoy/secret.txt)"
          case "$RESULT$USAGE" in *"$TOKEN"*|*"$DECOY"*) echo "the result contains the key or the decoy; it is discarded"; exit 1;; esac
          mkdir -p result
          if [ -n "$RESULT" ]; then printf '%s' "$RESULT" > "result/$TASK.json"; fi
          if [ -n "$USAGE" ]; then printf '%s' "$USAGE" > "result/$TASK.usage.json"; fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: melchior-result-${{ matrix.task.id }}
          path: result/
          retention-days: 7
          if-no-files-found: ignore

  write:
    needs: [prepare, think]
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    concurrency:
      group: magi-writer
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements.txt
      - name: Configure the commit identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Remember where main starts
        run: echo "MAGI_BEFORE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: melchior-work
          path: work
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        continue-on-error: true
        with:
          pattern: melchior-result-*
          path: work/results
          merge-multiple: true
      - name: Record fills, settlements and checked model results
        run: python -m engine melchior write --repo . --work work --mode "$MELCHIOR_MODE" --model-mode "$MELCHIOR_MODEL_MODE" --run-id "$GITHUB_RUN_ID"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MELCHIOR_MODE: ${{ vars.MELCHIOR_MODE }}
          MELCHIOR_MODEL_MODE: ${{ vars.MELCHIOR_MODEL_MODE }}
      - name: Show the preview
        if: always()
        run: if [ -f work/preview.md ]; then cat work/preview.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Publish the snapshot
        if: vars.MELCHIOR_MODE == 'live'
        run: python -m engine snapshot --repo . --publish
      - name: Audit this job's own push
        run: python -m engine audit --repo . --before "$MAGI_BEFORE" --after "$(git rev-parse HEAD)" --pusher "github-actions[bot]"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Check the whole repository
        run: python -m engine consistency --repo . --report-issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
