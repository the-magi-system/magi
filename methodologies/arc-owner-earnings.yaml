schema: magi/methodology@1
id: arc-owner-earnings
name: Arc 投资方法论：生意质量、资本配置与股东回报
summary: 把股票视为未来现金流的部分所有权，以C1生意质量、C2资本配置、C3价格与回报判断机会。核实盈利返还股东的比例、时间与方式，并比较留存再投资与股东自行配置资金两条路径的长期价值。以可持续穿透盈利归因学习，以股东实际总回报最终检验。
edge: 市场可能把短期利润、增长叙事或静态低估值当作股东回报，忽略维护与增长所需资本、融资及摊薄、资金受限和管理层留存再投资的质量。本方法通过匹配索偿口径、还原完整现金路径，并比较留存资本与股东可实现的替代机会，寻找经济盈利、资本配置和买入价格之间的错配；这一优势是假设，需要证据与后续结果验证。
process:
- 理解客户为何付钱，验证资源禀赋、成本位置、合同、客户关系、转换成本与网络效应，并估计优势期限和衰退风险。
- 由公开材料还原正常化经济盈利，考虑维护与更新资本开支、营运资金、税费及其他必要成本，区分周期和一次性收益。
- 识别可自由配置资金，审查分红、净回购、留存再投资、收购、降债与现金持有，判断普通股东取得价值的路径。
- 估算新增资本的长期回报、规模、持续年限及回收时间，与资金返还股东后的实际替代机会比较，统一风险、币种、期限、杠杆、流动性和税费口径。
- 完整计入未来平台所需投入、融资成本、等待时间和潜在摊薄；按经济特征匹配企业价值或股权价值，避免现金重复计算。
- 估算普通股东长期回报和下行情景，列明假设、安全边际、反证与下一步验证指标，逐项评估八项标准。
- 区分企业内生增长、资本再配置、新增资金和杠杆的贡献，同时跟踪每股及每单位投入经济价值与股东实际总回报，随新证据修正。
criteria:
- id: c1-business
  text: 企业持续赚钱的优势是什么，能够维持多久？须以经济需求、竞争结构、资源/成本/合同/客户关系等证据解释，并列出衰退风险。
- id: c1-earnings
  text: 正常化、可持续经济盈利是多少，依据是什么？须考虑维护与更新资本开支、营运资金、税费等必要成本，区分周期高点与一次性收益。
- id: c2-shareholder-return
  text: 盈利中有多少、何时、以何种方式返还股东？须核实分红、净回购、资金限制及治理，回购以价格与净股数变化判断。
- id: c2-retained-return
  text: 留存盈利的用途、增量回报、兑现时间和持续空间是什么？须区分历史平均ROIC与未来新增资本回报，纳入收购及后续投入。
- id: c2-opportunity-cost
  text: 留存再投资是否优于股东实际可获得的替代机会？须比较两条现金路径的价值，统一风险、币种、期限、杠杆、流动性和税费，不能把目标IRR当成必然可实现的替代收益。
- id: c3-growth-funding
  text: 增长所需资本、融资和潜在摊薄是否充分计入？须列明平台兑现条件与时间，并以匹配索偿口径计入所有必要投入。
- id: c3-price-return
  text: 当前价格对应怎样的预期回报和安全边际？须说明等待时间、期间分配、每股变化、期末价值及下行情景，同一笔现金只计算一次。
- id: research-falsification
  text: 哪些证据会推翻判断，下一步需要验证什么？须区分事实、管理层指引、研究假设与未知，并逐项标记满足、部分满足或未满足。
scope:
  asset_types:
  - equity
  sectors:
  - energy
  - materials
  - industrials
  - financials
  - information-technology
  - communication-services
  - utilities
  - consumer-discretionary
  - consumer-staples
  horizon_months:
    min: 12
    max: 120
exclusions: 无法以足够证据理解盈利来源、维护与增长投入、融资或普通股东取得价值路径的机会，保持待研究。禁止提交重大非公开信息或受保密义务约束的材料。制造、工程、硬件和服务均按事实评估，不按行业标签排除。
failure_modes: 正常化盈利估计错误；护城河衰退或续约条款恶化；维护/更新/增长资本开支、融资与摊薄低估；管理层留存、收购或回购未创造价值；资金长期受限或无法返还；周期、币种与政策风险；将目标IRR误作可实现替代收益；将新增资金或杠杆造成的盈利增长误作资本配置进步；现金或价值重复计算。
body_md: '# Arc 投资方法论：生意质量、资本配置与股东回报


  我把股票视为对企业未来现金流的部分所有权，把投资组合视为一组控制权受限的企业。


  研究的核心，是理解这些企业能够持续创造多少经济盈利，其中多少、何时、以何种方式返还股东；留存的部分能够获得多高、持续多久的增量资本回报，以及这一配置是否优于股东收回资金后可以实现的其他投资机会。


  我通过以下三个维度判断投资机会。


  **C1：生意质量——企业为什么能持续赚钱？**


  首先理解客户为什么付钱，以及企业凭什么持续获得经济回报。重点考察资源禀赋、成本位置、合同与牌照、客户关系、转换成本、网络效应，以及这些优势的持续期限和衰退风险。


  盈利质量需要结合维持竞争力所需的投入判断。正常化经济盈利应考虑维护与更新资本开支、正常营运资金、税费和其他必要成本，并区分周期高点、一次性收益与可持续盈利。


  重复需求需要实际证据支持。制造、工程、硬件和服务企业，都应根据客户需求、替换周期、竞争结构和资本强度逐项判断。


  **C2：资本配置——赚到的钱，如何增加股东价值？**


  先识别企业真正可以自由配置的资金，再审查资金去向。


  | 资金去向 | 核心判断 |

  |---|---|

  | 分红 | 能返还多少、何时返还，是否具有持续性；股东实际取得资金存在哪些税费和限制 |

  | 回购 | 回购价格是否划算，扣除股权激励与新增发行后，净股数是否减少，剩余股东每股价值是否提高 |

  | 留存与再投资 | 新增投入能够获得怎样的长期回报，需要多久兑现，能够持续投入多大规模 |

  | 收购 | 将收购价格、整合成本、后续投入和融资全部计入后，是否仍创造价值 |

  | 降债与持有现金 | 是否有效降低风险、保留有价值的投资能力；长期闲置资金是否拖累回报 |


  对留存盈利，重点判断**未来新增资本的回报**。历史平均ROIC只是参考，不能证明新项目、并购或扩张仍能复制过去的成绩。建设周期较长的项目，还需要结合完整现金流、回收时间和融资约束判断。


  比较两条路径：


  - 资金留在企业，由管理层再投资，最终为股东创造多少价值；

  - 资金返还股东，由股东投入实际可获得的其他机会，能够创造多少价值。


  比较应统一风险、币种、期限、杠杆、流动性和税费口径。企业ROIC不能机械地与股东目标IRR直接比较，目标回报也不能当作股东必然能实现的替代收益。


  支持留存，需要有可信的再投资机会、足够的回报和可验证的执行能力。再投资机会不足时，及时返还资本同样是优秀的资本配置。管理层的激励、治理和对少数股东的态度，是判断这些承诺能否兑现的重要依据。


  **C3：价格与回报——当前价格是否值得承担这些风险？**


  将现有盈利、未来增长、资本返还和留存再投资连接起来，估算普通股东可以获得的长期回报。


  未来平台必须计入建设时间、全部必要资本开支、营运资金、融资成本和潜在摊薄。尚未落实的项目、资源转化和收购机会，应按兑现条件与不确定性处理。


  估值口径需要匹配：企业层面的经营现金流对应企业价值，股东层面的盈利与分配对应股权价值；保险、控股公司和有限寿命资源资产，应采用符合其经济特征的方法。


  平台期持续盈利或现金流收益率，是筛选工具。最终投资回报还取决于等待时间、期间投入、分配方式、每股权益变化和期末价值。分红、回购、降债、留存现金与期末价值必须衔接，同一笔现金只计算一次。


  个股研究通常以约15%–20%的预期IRR作为机会筛选参考，并结合确定性与风险调整要求；组合长期复利预期约为12%–15%。这些都是目标，需要通过完整假设和后续结果检验。


  **研究、反馈与修正**


  我用可持续穿透盈利的变化检验判断，并区分企业内生增长、资本再配置、新增资金和杠杆的影响，同时跟踪每股及每单位投入所对应的经济价值。


  穿透盈利是归因和学习的重要反馈，股东实际总回报是最终检验。盈利增长仍需检查资本消耗、风险和股东取得价值的路径；股价变化则需要结合基本面与估值分别判断。


  每篇投资观点都应明确回答：


  1. 企业持续赚钱的优势是什么，能够维持多久？

  2. 正常化、可持续经济盈利是多少，依据是什么？

  3. 盈利中有多少、何时、以何种方式返还股东？

  4. 留存盈利的用途、增量回报、兑现时间和持续空间是什么？

  5. 留存再投资是否优于股东实际可获得的替代机会？

  6. 增长所需资本、融资和潜在摊薄是否充分计入？

  7. 当前价格对应怎样的预期回报和安全边际？

  8. 哪些证据会推翻判断，下一步需要验证什么？


  事实、管理层指引、研究假设与未知事项应清楚区分。每项标准均标明满足、部分满足或未满足，并随着新证据修正。

  '
